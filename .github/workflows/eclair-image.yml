# eclAIr books: build Bigcapital's web app with eclAIr's look and words, and publish it for eclAIr books' front to run.
name: eclAIr web app image
on:
  push:
    branches: [eclair]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/webapp/Dockerfile
          push: true
          tags: |
            ghcr.io/eclair-co/bigcapital-webapp:eclair
            ghcr.io/eclair-co/bigcapital-webapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
